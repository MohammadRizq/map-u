<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">ثلاث لوحات، كل واحدة تعرض صورة مختلفة عند الضغط عليها</h2>
<div dir="rtl" style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px;">
  <button onclick="sendPrompt('وريني صورة جبال وطبيعة')" style="cursor:pointer; text-align:right; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem; display:flex; flex-direction:column; gap:10px;">
    <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-mountain" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i></div>
    <p style="font-size:14px; font-weight:500; margin:0; color:var(--text-primary);">لوحة الطبيعة</p>
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">اضغط لعرض صورة جبال وطبيعة</p>
  </button>
  <button onclick="sendPrompt('وريني صورة مدينة ليلاً')" style="cursor:pointer; text-align:right; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem; display:flex; flex-direction:column; gap:10px;">
    <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-building-skyscraper" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i></div>
    <p style="font-size:14px; font-weight:500; margin:0; color:var(--text-primary);">لوحة المدينة</p>
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">اضغط لعرض صورة مدينة ليلاً</p>
  </button>
  <button onclick="sendPrompt('وريني صورة بحر وشاطئ')" style="cursor:pointer; text-align:right; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem; display:flex; flex-direction:column; gap:10px;">
    <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-beach" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i></div>
    <p style="font-size:14px; font-weight:500; margin:0; color:var(--text-primary);">لوحة البحر</p>
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">اضغط لعرض صورة بحر وشاطئ</p>
  </button>
</div>
