<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة جامعة طيبة</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --border: #e2e8f0;
      --surface-1: #f8fafc;
      --fill-ghost-selected: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --radius: 8px;
      --primary-color: #d97706;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
      font-family: var(--font-sans);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dashboard-container {
      display: flex;
      flex-direction: row;
      gap: 0;
      min-height: 500px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface-1);
      border-left: 1px solid var(--border);
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .sidebar-hidden {
      display: none !important;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: transparent;
      border: none;
      text-align: right;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover {
      background: rgba(226, 232, 240, 0.5);
    }

    .nav-item.active {
      background: var(--fill-ghost-selected);
      color: var(--text-primary);
      font-weight: 500;
    }

    .content-area {
      flex: 1;
      padding: 25px;
      overflow-x: hidden;
    }

    .panel {
      animation: fadeIn 0.3s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card p.title {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 8px;
    }

    .stat-card p.value {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-primary);
      margin: 0;
    }

    .arrow-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--text-primary);
      font-size: 14px;
      transition: background 0.2s;
    }

    .arrow-btn:hover {
      background: var(--fill-ghost-selected);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .image-container {
      margin-top: 15px;
      text-align: center;
    }

    .building-img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      border-radius: var(--radius);
      transition: transform 0.25s ease-in-out, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }

    .building-img:hover {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .building-img.pop {
      transform: scale(1.03);
    }

    #levels-viewer {
      display: none;
      flex-direction: column;
      background: var(--surface-1);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    .arrows-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* ==========================================
       ستايل المناطق القابلة للنقر (التفاعلية)
       ========================================== */
    #interactive-map-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    #current-level-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .clickable-zone {
      position: absolute;
      /* لون الخلفية للتجربة لتتمكن من رؤية الأماكن وتعديلها */
      background: rgba(217, 119, 6, 0.4); 
      border: 2px dashed var(--primary-color);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      border-radius: 4px;
    }

    .clickable-zone:hover {
      /* لون عند تمرير الماوس */
      background: rgba(217, 119, 6, 0.7);
      transform: scale(1.05);
    }

    /* ملاحظة: عندما تنتهي من ضبط الأماكن، قم باستبدال الـ background و الـ border في الأعلى بـ:
       background: transparent;
       border: none;
    */

    /* ستايل صفحة التفاصيل (الصورة الثانية) */
    #detail-viewer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    #detail-image {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body { padding: 15px; }
      .dashboard-container { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-bottom: 1px solid var(--border); padding: 15px; }
      .content-area { padding: 15px; }
      .arrows-container { justify-content: center; }
      #btn-back { width: 100%; justify-content: center; margin-top: 10px; margin-right: 0 !important; }
    }

    body.dark-mode {
      background-color: #0f172a;
      --border: #334155;
      --surface-1: #1e293b;
      --fill-ghost-selected: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }
    body.dark-mode .arrow-btn { background: #1e293b; color: var(--text-primary); }
    body.dark-mode .arrow-btn:hover { background: var(--fill-ghost-selected); }
  </style>
</head>
<body>

  <div style="display: flex; gap: 10px; margin-bottom: 15px;">
    <button id="toggle-sidebar" class="arrow-btn"><i class="ti ti-menu-2"></i> القائمة الجانبية</button>
    <button id="toggle-dark-mode" class="arrow-btn"><i class="ti ti-moon"></i> الوضع الداكن</button>
  </div>

  <div class="dashboard-container">
    
    <div id="sidebar" class="sidebar sidebar-hidden-mobile">
      <button class="nav-item" data-section="overview"><i class="ti ti-layout-dashboard"></i> المقر الرئيسي</button>
      <button class="nav-item active" data-section="projects"><i class="ti ti-folder"></i> مقر ابيار علي 172</button>
      <button class="nav-item" data-section="tasks"><i class="ti ti-checklist"></i> مقر كلية السلام</button>
    </div>

    <div class="content-area">
      
      <!-- المقر الرئيسي -->
      <div id="panel-overview" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">المقر الرئيسي</h3>
        <p style="color:var(--text-secondary);">محتوى المقر الرئيسي يظهر هنا...</p>
      </div>

      <!-- مقر ابيار علي 172 -->
      <div id="panel-projects" class="panel" style="display:block;">
        
        <div class="stats-grid">
          <div class="stat-card"><p class="title">عدد الكليات</p><p class="value">3</p></div>
          <div class="stat-card"><p class="title">عدد الأدوار</p><p class="value">3</p></div>
          <div class="stat-card"><p class="title">عدد القاعات</p><p class="value">120</p></div>
        </div>
        
        <!-- الصورة الرئيسية -->
        <div class="image-container" id="main-map-container">
          <p style="font-size:15px; color:var(--text-secondary); margin:0 0 12px 0;">
            <i class="ti ti-click" style="vertical-align: middle;"></i> اضغط على الصورة أدناه لعرض مخططات الأدوار:
          </p>
          <img id="main-map-img" src="https://k.top4top.io/p_3897iqqsm1.jpg" class="building-img" alt="صورة المبنى الرئيسي">
        </div>
        
        <!-- عارض المستويات -->
        <div id="levels-viewer">
          
          <!-- أزرار التنقل بين الأدوار -->
          <div class="arrows-container" id="floor-controls">
            <button id="btn-up" class="arrow-btn"><i class="ti ti-arrow-up"></i> الدور الأعلى</button>
            <button id="btn-down" class="arrow-btn"><i class="ti ti-arrow-down"></i> الدور الأسفل</button>
            <button id="btn-back" class="arrow-btn" style="color: var(--primary-color); margin-right: auto;">
              <i class="ti ti-arrow-back-up"></i> رجوع للمبنى
            </button>
          </div>
          
          <!-- الحاوية التفاعلية للمخطط (التي تحتوي على الصورة والأجزاء القابلة للنقر) -->
          <div style="text-align: center;" id="interactive-area">
            <div id="interactive-map-container">
              <img id="current-level-img" src="" alt="مخطط الدور">
              <!-- سيتم توليد الأزرار الشفافة هنا بواسطة الجافاسكريبت -->
            </div>
            <h3 id="level-indicator" style="margin: 15px 0 0 0; color: var(--text-primary);"></h3>
          </div>

          <!-- عارض تفاصيل الجزء (الصورة الثانية التي تظهر عند النقر) -->
          <div id="detail-viewer">
            <div style="width: 100%; display: flex; justify-content: flex-start;">
              <button id="btn-back-to-floor" class="arrow-btn" style="color: var(--primary-color);">
                <i class="ti ti-arrow-back-up"></i> رجوع لمخطط الدور
              </button>
            </div>
            <h3 id="detail-title" style="margin: 0; color: var(--text-primary);"></h3>
            <img id="detail-image" src="" alt="صورة تفصيلية">
          </div>

        </div>
      </div>

      <!-- كلية السلام -->
      <div id="panel-tasks" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">مقر كلية السلام</h3>
        <p style="color:var(--text-secondary);">محتوى كلية السلام يظهر هنا...</p>
      </div>

    </div>
  </div>

  <script>
  // 1. نظام القائمة الجانبية (لم يتغير)
  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggle-sidebar');
  if (window.innerWidth <= 768) { sidebar.classList.add('sidebar-hidden'); }
  toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('sidebar-hidden'));
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.getElementById('panel-' + btn.getAttribute('data-section')).style.display = 'block';
      if (window.innerWidth <= 768) sidebar.classList.add('sidebar-hidden');
    });
  });

  // ==========================================
  // 2. إعدادات المخططات والأجزاء القابلة للنقر
  // ==========================================
  
  const levelImages = [
    "https://l.top4top.io/p_3898sjw5n1.jpeg", // 0: الدور الأرضي
    "https://b.top4top.io/p_3897zgg9h1.jpg", // 1: الدور الأول
    "https://c.top4top.io/p_38970eadv2.jpg"  // 2: الدور الثاني
  ];
  const levelNames = ["الدور الأرضي", "الدور الأول", "الدور الثاني"];
  let currentLevel = 0; 

  /* 
    شرح كيفية التعديل على الأجزاء (Zones):
    - top: البعد عن أعلى الصورة (بالنسبة المئوية %)
    - left: البعد عن يسار الصورة (بالنسبة المئوية %)
    - width: عرض المربع القابل للنقر (بالنسبة المئوية %)
    - height: طول المربع القابل للنقر (بالنسبة المئوية %)
    - targetImg: رابط الصورة التي تريد أن تظهر عند النقر على هذا الجزء
    - title: اسم الجزء (سيظهر كعنوان للصورة الجديدة)
  */

  const interactiveZones = {
    // --------------------------------
    // أجزاء الدور الأرضي (7 أجزاء عشوائية)
    // --------------------------------
    0: [
      { top: '10%', left: '10%', width: '15%', height: '15%', title: 'المدخل الرئيسي', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+1' },
      { top: '10%', left: '30%', width: '15%', height: '15%', title: 'المسرح', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+2' },
      { top: '10%', left: '70%', width: '20%', height: '15%', title: 'مكاتب الإدارة', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+3' },
      { top: '40%', left: '10%', width: '20%', height: '20%', title: 'قاعة 1', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+4' },
      { top: '40%', left: '70%', width: '20%', height: '20%', title: 'قاعة 2', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+5' },
      { top: '70%', left: '20%', width: '25%', height: '15%', title: 'الكافتيريا', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+6' },
      { top: '70%', left: '55%', width: '25%', height: '15%', title: 'الساحة الخارجية', targetImg: 'https://via.placeholder.com/800x400?text=Ground+Floor+Part+7' },
    ],
    // --------------------------------
    // أجزاء الدور الأول (7 أجزاء عشوائية)
    // --------------------------------
    1: [
      { top: '15%', left: '15%', width: '20%', height: '20%', title: 'معمل الحاسب 1', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+1' },
      { top: '15%', left: '40%', width: '20%', height: '20%', title: 'معمل الحاسب 2', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+2' },
      { top: '15%', left: '65%', width: '20%', height: '20%', title: 'مكتبة الدور الأول', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+3' },
      { top: '50%', left: '15%', width: '15%', height: '25%', title: 'قاعة المحاضرات A', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+4' },
      { top: '50%', left: '35%', width: '15%', height: '25%', title: 'قاعة المحاضرات B', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+5' },
      { top: '50%', left: '55%', width: '15%', height: '25%', title: 'قاعة المحاضرات C', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+6' },
      { top: '50%', left: '75%', width: '15%', height: '25%', title: 'دورات المياه', targetImg: 'https://via.placeholder.com/800x400?text=First+Floor+Part+7' },
    ],
    // --------------------------------
    // أجزاء الدور الثاني (7 أجزاء عشوائية)
    // --------------------------------
    2: [
      { top: '20%', left: '10%', width: '20%', height: '15%', title: 'مكاتب الدكاترة 1', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+1' },
      { top: '20%', left: '40%', width: '20%', height: '15%', title: 'مكاتب الدكاترة 2', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+2' },
      { top: '20%', left: '70%', width: '20%', height: '15%', title: 'مكاتب الدكاترة 3', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+3' },
      { top: '50%', left: '10%', width: '35%', height: '20%', title: 'المعمل المتقدم', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+4' },
      { top: '50%', left: '55%', width: '35%', height: '20%', title: 'قاعة المناقشات', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+5' },
      { top: '80%', left: '20%', width: '20%', height: '10%', title: 'استراحة الطالبات', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+6' },
      { top: '80%', left: '60%', width: '20%', height: '10%', title: 'المصلى', targetImg: 'https://via.placeholder.com/800x400?text=Second+Floor+Part+7' },
    ]
  };

  const mainMapContainer = document.getElementById('main-map-container');
  const mainMapImg = document.getElementById('main-map-img');
  const levelsViewer = document.getElementById('levels-viewer');
  const floorControls = document.getElementById('floor-controls');
  const interactiveArea = document.getElementById('interactive-area');
  const interactiveMapContainer = document.getElementById('interactive-map-container');
  const currentLevelImg = document.getElementById('current-level-img');
  const levelIndicator = document.getElementById('level-indicator');
  const detailViewer = document.getElementById('detail-viewer');
  const detailImage = document.getElementById('detail-image');
  const detailTitle = document.getElementById('detail-title');
  
  const btnUp = document.getElementById('btn-up');
  const btnDown = document.getElementById('btn-down');
  const btnBack = document.getElementById('btn-back');
  const btnBackToFloor = document.getElementById('btn-back-to-floor');

  // الدخول لعارض الأدوار
  mainMapImg.addEventListener('click', function() {
    mainMapImg.classList.add('pop');
    setTimeout(() => {
      mainMapImg.classList.remove('pop');
      mainMapContainer.style.display = 'none'; 
      levelsViewer.style.display = 'flex'; 
      updateLevelView(); 
    }, 250); 
  });

  // التحكم بالأدوار
  btnUp.addEventListener('click', () => { if (currentLevel < levelImages.length - 1) { currentLevel++; updateLevelView(); } });
  btnDown.addEventListener('click', () => { if (currentLevel > 0) { currentLevel--; updateLevelView(); } });
  btnBack.addEventListener('click', () => {
    levelsViewer.style.display = 'none';
    mainMapContainer.style.display = 'block';
    currentLevel = 0; 
  });

  // الرجوع من الصورة التفصيلية إلى مخطط الدور
  btnBackToFloor.addEventListener('click', () => {
    detailViewer.style.display = 'none';
    floorControls.style.display = 'flex';
    interactiveArea.style.display = 'block';
  });

  // دالة تحديث وعرض المخطط ورسم الأجزاء التفاعلية
  function updateLevelView() {
    // تحديث صورة الدور الأساسية
    currentLevelImg.src = levelImages[currentLevel];
    levelIndicator.innerText = levelNames[currentLevel];
    btnDown.disabled = (currentLevel === 0);
    btnUp.disabled = (currentLevel === levelImages.length - 1);

    // حذف الأجزاء (Zones) السابقة حتى لا تتداخل
    const existingZones = interactiveMapContainer.querySelectorAll('.clickable-zone');
    existingZones.forEach(zone => zone.remove());

    // رسم الأجزاء الجديدة الخاصة بالدور الحالي
    const currentZones = interactiveZones[currentLevel];
    if(currentZones) {
      currentZones.forEach(zoneData => {
        const zoneDiv = document.createElement('div');
        zoneDiv.className = 'clickable-zone';
        
        // تعيين الأبعاد والموقع بناءً على النسب المئوية التي وضعناها
        zoneDiv.style.top = zoneData.top;
        zoneDiv.style.left = zoneData.left;
        zoneDiv.style.width = zoneData.width;
        zoneDiv.style.height = zoneData.height;
        
        // إضافة حدث النقر على الجزء
        zoneDiv.addEventListener('click', () => {
          showDetailImage(zoneData.targetImg, zoneData.title);
        });

        interactiveMapContainer.appendChild(zoneDiv);
      });
    }
  }

  // دالة إظهار الصورة التفصيلية للجزء
  function showDetailImage(imgSrc, title) {
    floorControls.style.display = 'none';     // إخفاء أزرار فوق/تحت
    interactiveArea.style.display = 'none';   // إخفاء المخطط
    
    detailImage.src = imgSrc;                 // وضع الصورة الجديدة
    detailTitle.innerText = title;            // وضع عنوان الصورة
    detailViewer.style.display = 'flex';      // عرض قسم التفاصيل
  }

  // 3. نظام الوضع الداكن (لم يتغير)
  const darkModeBtn = document.getElementById('toggle-dark-mode');
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    darkModeBtn.innerHTML = '<i class="ti ti-sun"></i> الوضع الفاتح';
  }
  darkModeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      localStorage.setItem('theme', 'dark');
      darkModeBtn.innerHTML = '<i class="ti ti-sun"></i> الوضع الفاتح';
    } else {
      localStorage.setItem('theme', 'light');
      darkModeBtn.innerHTML = '<i class="ti ti-moon"></i> الوضع الداكن';
    }
  });
  </script>

</body>
</html>
