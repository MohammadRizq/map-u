<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة جامعة طيبة</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --border: #e2e8f0;
      --surface-1: #f8fafc;
      --fill-ghost-selected: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --radius: 8px;
      --primary-color: #d97706;
    }
    
    * { box-sizing: border-box; }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
      font-family: var(--font-sans);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dashboard-container {
      display: flex;
      flex-direction: row;
      gap: 0;
      min-height: 500px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface-1);
      border-left: 1px solid var(--border);
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .sidebar-hidden { display: none !important; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: transparent;
      border: none;
      text-align: right;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s;
    }

    .nav-item i { font-size: 20px; }
    .nav-item:hover { background: rgba(226, 232, 240, 0.5); }
    .nav-item.active { background: var(--fill-ghost-selected); color: var(--text-primary); font-weight: 500; }

    .content-area {
      flex: 1;
      padding: 25px;
      overflow-x: hidden;
    }

    .panel { animation: fadeIn 0.3s ease; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card p.title { font-size: 14px; color: var(--text-muted); margin: 0 0 8px; }
    .stat-card p.value { font-size: 28px; font-weight: bold; color: var(--text-primary); margin: 0; }

    .arrow-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--text-primary);
      font-size: 14px;
      transition: background 0.2s;
    }

    .arrow-btn:hover { background: var(--fill-ghost-selected); }
    .arrow-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .image-container { margin-top: 15px; text-align: center; }

    .building-img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      border-radius: var(--radius);
      transition: transform 0.25s ease-in-out, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }

    .building-img:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .building-img.pop { transform: scale(1.03); }

    #levels-viewer {
      display: none;
      flex-direction: column;
      background: var(--surface-1);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    .arrows-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #interactive-map-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    #current-level-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .clickable-zone {
      position: absolute;
      background: rgba(217, 119, 6, 0.4); 
      /* تم إزالة الإطار المتقطع لأنه لا يتوافق جيداً مع الأشكال المخصصة (clip-path) */
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .clickable-zone:hover {
      background: rgba(217, 119, 6, 0.7);
      transform: scale(1.05);
    }

    #detail-viewer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    #detail-image {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body { padding: 15px; }
      .dashboard-container { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-bottom: 1px solid var(--border); padding: 15px; }
      .content-area { padding: 15px; }
      .arrows-container { justify-content: center; }
      #btn-back { width: 100%; justify-content: center; margin-top: 10px; margin-right: 0 !important; }
    }

    body.dark-mode {
      background-color: #0f172a;
      --border: #334155;
      --surface-1: #1e293b;
      --fill-ghost-selected: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }
    body.dark-mode .arrow-btn { background: #1e293b; color: var(--text-primary); }
    body.dark-mode .arrow-btn:hover { background: var(--fill-ghost-selected); }
  </style>
</head>
<body>

  <div style="display: flex; gap: 10px; margin-bottom: 15px;">
    <button id="toggle-sidebar" class="arrow-btn"><i class="ti ti-menu-2"></i> القائمة الجانبية</button>
    <button id="toggle-dark-mode" class="arrow-btn"><i class="ti ti-moon"></i> الوضع الداكن</button>
  </div>

  <div class="dashboard-container">
    
    <div id="sidebar" class="sidebar sidebar-hidden-mobile">
      <button class="nav-item" data-section="overview"><i class="ti ti-layout-dashboard"></i> المقر الرئيسي</button>
      <button class="nav-item active" data-section="projects"><i class="ti ti-folder"></i> مقر ابيار علي 172</button>
      <button class="nav-item" data-section="tasks"><i class="ti ti-checklist"></i> مقر كلية السلام</button>
    </div>

    <div class="content-area">
      
      <div id="panel-overview" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">المقر الرئيسي</h3>
        <p style="color:var(--text-secondary);">محتوى المقر الرئيسي يظهر هنا...</p>
      </div>

      <div id="panel-projects" class="panel" style="display:block;">
        
        <div class="stats-grid">
          <div class="stat-card"><p class="title">عدد الكليات</p><p class="value">3</p></div>
          <div class="stat-card"><p class="title">عدد الأدوار</p><p class="value">3</p></div>
          <div class="stat-card"><p class="title">عدد القاعات</p><p class="value">120</p></div>
        </div>
        
        <div class="image-container" id="main-map-container">
          <p style="font-size:15px; color:var(--text-secondary); margin:0 0 12px 0;">
            <i class="ti ti-click" style="vertical-align: middle;"></i> اضغط على الصورة أدناه لعرض مخططات الأدوار:
          </p>
          <img id="main-map-img" src="https://k.top4top.io/p_3897iqqsm1.jpg" class="building-img" alt="صورة المبنى الرئيسي">
        </div>
        
        <div id="levels-viewer">
          
          <div class="arrows-container" id="floor-controls">
            <button id="btn-up" class="arrow-btn"><i class="ti ti-arrow-up"></i> الدور الأعلى</button>
            <button id="btn-down" class="arrow-btn"><i class="ti ti-arrow-down"></i> الدور الأسفل</button>
            <button id="btn-back" class="arrow-btn" style="color: var(--primary-color); margin-right: auto;">
              <i class="ti ti-arrow-back-up"></i> رجوع للمبنى
            </button>
          </div>
          
          <div style="text-align: center;" id="interactive-area">
            <div id="interactive-map-container">
              <img id="current-level-img" src="" alt="مخطط الدور">
            </div>
            <h3 id="level-indicator" style="margin: 15px 0 0 0; color: var(--text-primary);"></h3>
          </div>

          <div id="detail-viewer">
            <div style="width: 100%; display: flex; justify-content: flex-start;">
              <button id="btn-back-to-floor" class="arrow-btn" style="color: var(--primary-color);">
                <i class="ti ti-arrow-back-up"></i> رجوع لمخطط الدور
              </button>
            </div>
            <h3 id="detail-title" style="margin: 0; color: var(--text-primary);"></h3>
            <img id="detail-image" src="" alt="صورة تفصيلية">
          </div>

        </div>
      </div>

      <div id="panel-tasks" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">مقر كلية السلام</h3>
        <p style="color:var(--text-secondary);">محتوى كلية السلام يظهر هنا...</p>
      </div>

    </div>
  </div>

  <script>
  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggle-sidebar');
  if (window.innerWidth <= 768) { sidebar.classList.add('sidebar-hidden'); }
  toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('sidebar-hidden'));
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.getElementById('panel-' + btn.getAttribute('data-section')).style.display = 'block';
      if (window.innerWidth <= 768) sidebar.classList.add('sidebar-hidden');
    });
  });

  const levelImages = [
    "https://a.top4top.io/p_3898fh2yv1.jpg", 
    "https://b.top4top.io/p_3897zgg9h1.jpg", 
    "https://c.top4top.io/p_38970eadv2.jpg"  
  ];
  const levelNames = ["الدور الأرضي", "الدور الأول", "الدور الثاني"];
  let currentLevel = 0; 

  /*
    أضفنا خاصية `clipPath` لكل جزء:
    - polygon(0 0, 100% 30%, 100% 100%, 0 100%) : هذا هو الشكل الموجود في صورتك.
    - يمكنك إزالة الـ clipPath لأي جزء ليعود مربعاً عادياً، أو تغييره لرسم أشكال أخرى.
  */
  const myCustomShape = 'polygon(0% 0%, 100% 30%, 100% 100%, 0% 100%)';
  // الشكل المعقد (ذو المنحنى والبروز الأيسر)
  const fd = 'polygon(32% 0%, 42% 4%, 55% 6%, 68% 10%, 80% 17%, 89% 26%, 94% 31%, 100% 36%, 100% 100%, 32% 100%, 32% 77%, 0% 77%, 0% 57%, 32% 57%)';

    const dsds = 'circle(100% at 100% 100%)';

  const interactiveZones = {
    0: [
      /*{ top: '10%', left: '10%', width: '15%', height: '25%', clipPath: dsds, title: 'المدخل الرئيسي', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+1' },
      */
      { top: '0%', left: '39.2%', width: '15.35%', height: '48.3%', clipPath: fd, title: 'جناح A', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+2' },
      { top: '0%', left: '54.6%', width: '15.35%', height: '48.3%', clipPath: fd, title: 'جناح B', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+3' },
      { top: '0%', left: '69.6%', width: '15.35%', height: '48.3%', clipPath: fd, title: 'جناح C', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+4' },
      { top: '0%', left: '84.6%', width: '15.35%', height: '48.3%', clipPath: fd, title: 'جناح D', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+5' },
      /*{ top: '70%', left: '20%', width: '25%', height: '25%', clipPath: myCustomShape, title: 'الكافتيريا', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+6' },
      { top: '70%', left: '55%', width: '25%', height: '25%', clipPath: myCustomShape, title: 'الساحة الخارجية', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Ground+Floor+Part+7' },
       */
    ],
    1: [
      { top: '15%', left: '15%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'معمل الحاسب 1', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+1' },
      { top: '15%', left: '40%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'معمل الحاسب 2', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+2' },
      { top: '15%', left: '65%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'مكتبة الدور الأول', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+3' },
      { top: '50%', left: '15%', width: '15%', height: '30%', clipPath: myCustomShape, title: 'قاعة المحاضرات A', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+4' },
      { top: '50%', left: '35%', width: '15%', height: '30%', clipPath: myCustomShape, title: 'قاعة المحاضرات B', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+5' },
      { top: '50%', left: '55%', width: '15%', height: '30%', clipPath: myCustomShape, title: 'قاعة المحاضرات C', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+6' },
      { top: '50%', left: '75%', width: '15%', height: '30%', clipPath: myCustomShape, title: 'دورات المياه', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=First+Floor+Part+7' },
    ],
    2: [
      { top: '20%', left: '10%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'مكاتب الدكاترة 1', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+1' },
      { top: '20%', left: '40%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'مكاتب الدكاترة 2', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+2' },
      { top: '20%', left: '70%', width: '20%', height: '25%', clipPath: myCustomShape, title: 'مكاتب الدكاترة 3', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+3' },
      { top: '50%', left: '10%', width: '35%', height: '30%', clipPath: myCustomShape, title: 'المعمل المتقدم', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+4' },
      { top: '50%', left: '55%', width: '35%', height: '30%', clipPath: myCustomShape, title: 'قاعة المناقشات', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+5' },
      { top: '80%', left: '20%', width: '20%', height: '15%', clipPath: myCustomShape, title: 'استراحة الطالبات', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+6' },
      { top: '80%', left: '60%', width: '20%', height: '15%', clipPath: myCustomShape, title: 'المصلى', targetImg: 'https://j.top4top.io/p_3898cr9wq1.jpg?text=Second+Floor+Part+7' },
    ]
  };

  const mainMapContainer = document.getElementById('main-map-container');
  const mainMapImg = document.getElementById('main-map-img');
  const levelsViewer = document.getElementById('levels-viewer');
  const floorControls = document.getElementById('floor-controls');
  const interactiveArea = document.getElementById('interactive-area');
  const interactiveMapContainer = document.getElementById('interactive-map-container');
  const currentLevelImg = document.getElementById('current-level-img');
  const levelIndicator = document.getElementById('level-indicator');
  const detailViewer = document.getElementById('detail-viewer');
  const detailImage = document.getElementById('detail-image');
  const detailTitle = document.getElementById('detail-title');
  
  const btnUp = document.getElementById('btn-up');
  const btnDown = document.getElementById('btn-down');
  const btnBack = document.getElementById('btn-back');
  const btnBackToFloor = document.getElementById('btn-back-to-floor');

  mainMapImg.addEventListener('click', function() {
    mainMapImg.classList.add('pop');
    setTimeout(() => {
      mainMapImg.classList.remove('pop');
      mainMapContainer.style.display = 'none'; 
      levelsViewer.style.display = 'flex'; 
      updateLevelView(); 
    }, 250); 
  });

  btnUp.addEventListener('click', () => { if (currentLevel < levelImages.length - 1) { currentLevel++; updateLevelView(); } });
  btnDown.addEventListener('click', () => { if (currentLevel > 0) { currentLevel--; updateLevelView(); } });
  btnBack.addEventListener('click', () => {
    levelsViewer.style.display = 'none';
    mainMapContainer.style.display = 'block';
    currentLevel = 0; 
  });

  btnBackToFloor.addEventListener('click', () => {
    detailViewer.style.display = 'none';
    floorControls.style.display = 'flex';
    interactiveArea.style.display = 'block';
  });

  function updateLevelView() {
    currentLevelImg.src = levelImages[currentLevel];
    levelIndicator.innerText = levelNames[currentLevel];
    btnDown.disabled = (currentLevel === 0);
    btnUp.disabled = (currentLevel === levelImages.length - 1);

    const existingZones = interactiveMapContainer.querySelectorAll('.clickable-zone');
    existingZones.forEach(zone => zone.remove());

    const currentZones = interactiveZones[currentLevel];
    if(currentZones) {
      currentZones.forEach(zoneData => {
        const zoneDiv = document.createElement('div');
        zoneDiv.className = 'clickable-zone';
        
        zoneDiv.style.top = zoneData.top;
        zoneDiv.style.left = zoneData.left;
        zoneDiv.style.width = zoneData.width;
        zoneDiv.style.height = zoneData.height;

        // تطبيق الشكل المخصص إذا كان موجوداً
        if (zoneData.clipPath) {
          zoneDiv.style.clipPath = zoneData.clipPath;
          zoneDiv.style.webkitClipPath = zoneData.clipPath; // لدعم متصفح سفاري
        }
        
        zoneDiv.addEventListener('click', () => {
          showDetailImage(zoneData.targetImg, zoneData.title);
        });

        interactiveMapContainer.appendChild(zoneDiv);
      });
    }
  }

  function showDetailImage(imgSrc, title) {
    floorControls.style.display = 'none';     
    interactiveArea.style.display = 'none';   
    
    detailImage.src = imgSrc;                 
    detailTitle.innerText = title;            
    detailViewer.style.display = 'flex';      
  }

  const darkModeBtn = document.getElementById('toggle-dark-mode');
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    darkModeBtn.innerHTML = '<i class="ti ti-sun"></i> الوضع الفاتح';
  }
  darkModeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      localStorage.setItem('theme', 'dark');
      darkModeBtn.innerHTML = '<i class="ti ti-sun"></i> الوضع الفاتح';
    } else {
      localStorage.setItem('theme', 'light');
      darkModeBtn.innerHTML = '<i class="ti ti-moon"></i> الوضع الداكن';
    }
  });
  </script>

</body>
</html>
