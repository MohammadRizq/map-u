<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة جامعة طيبة</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --border: #e2e8f0;
      --surface-1: #f8fafc;
      --fill-ghost-selected: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --radius: 8px;
      --primary-color: #d97706;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
      font-family: var(--font-sans);
    }

    /* تخطيط الصفحة الأساسي (Layout) */
    .dashboard-container {
      display: flex;
      flex-direction: row;
      gap: 0;
      min-height: 500px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
    }

    /* القائمة الجانبية */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface-1);
      border-left: 1px solid var(--border);
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .sidebar-hidden {
      display: none !important;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: transparent;
      border: none;
      text-align: right;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s, color 0.2s;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover {
      background: rgba(226, 232, 240, 0.5);
    }

    .nav-item.active {
      background: var(--fill-ghost-selected);
      color: var(--text-primary);
      font-weight: 500;
    }

    /* منطقة المحتوى */
    .content-area {
      flex: 1;
      padding: 25px;
      overflow-x: hidden;
    }

    .panel {
      animation: fadeIn 0.3s ease;
    }

    /* شبكة الإحصائيات */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card p.title {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 8px;
    }

    .stat-card p.value {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-primary);
      margin: 0;
    }

    /* الأزرار العامة */
    .arrow-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--text-primary);
      font-size: 14px;
      transition: background 0.2s;
    }

    .arrow-btn:hover {
      background: var(--fill-ghost-selected);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* الصور (المبنى والمخططات) */
    .image-container {
      margin-top: 15px;
    }

    .building-img, #current-level-img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.25s ease-in-out, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: block;
    }

    #current-level-img {
      cursor: zoom-in;
    }

    .building-img:hover {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .building-img.pop {
      transform: scale(1.03);
    }

    /* عارض المستويات */
    #levels-viewer {
      display: none;
      flex-direction: column;
      background: var(--surface-1);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    .arrows-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* نافذة التكبير (Modal) */
    #image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 9999;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    .modal-controls {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      background: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #modal-img-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #modal-img {
      transition: width 0.2s ease-in-out;
      width: 90%;
      max-width: none;
      border-radius: var(--radius);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       التجاوب مع الشاشات الصغيرة (الجوال)
       ========================================== */
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }
      
      .dashboard-container {
        flex-direction: column; /* تحويل التخطيط لعمودي */
      }

      .sidebar {
        width: 100%;
        border-left: none;
        border-bottom: 1px solid var(--border);
        padding: 15px;
      }

      .content-area {
        padding: 15px;
      }

      .building-img, #current-level-img {
        height: 220px; /* تصغير ارتفاع الصور في الجوال */
      }

      .arrows-container {
        justify-content: center;
      }

      #btn-back {
        width: 100%;
        justify-content: center;
        margin-top: 10px;
        margin-right: 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- نافذة تكبير الصور -->
  <div id="image-modal">
    <div class="modal-header">
      <div class="modal-controls">
        <button class="modal-btn" id="zoom-in" title="تكبير"><i class="ti ti-zoom-in"></i> تكبير</button>
        <button class="modal-btn" id="zoom-out" title="تصغير"><i class="ti ti-zoom-out"></i> تصغير</button>
      </div>
      <button class="modal-btn" id="close-modal" style="color: #ef4444;"><i class="ti ti-x"></i> إغلاق</button>
    </div>
    <div id="modal-img-container">
      <img id="modal-img" src="" alt="صورة مكبرة">
    </div>
  </div>

  <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">لوحة تحكم خريطة الجامعة</h1>
  
  <!-- زر إظهار القائمة -->
  <button id="toggle-sidebar" class="arrow-btn">
    <i class="ti ti-menu-2"></i> القائمة الجانبية
  </button>

  <!-- الحاوية الرئيسية (Layout) -->
  <div class="dashboard-container">
    
    <!-- القائمة الجانبية -->
    <div id="sidebar" class="sidebar sidebar-hidden-mobile">
      <button class="nav-item" data-section="overview">
        <i class="ti ti-layout-dashboard"></i> المقر الرئيسي
      </button>
      <button class="nav-item active" data-section="projects">
        <i class="ti ti-folder"></i> مقر ابيار علي 172
      </button>
      <button class="nav-item" data-section="tasks">
        <i class="ti ti-checklist"></i> مقر كلية السلام
      </button>
    </div>

    <!-- منطقة المحتوى -->
    <div class="content-area">
      
      <!-- قسم المقر الرئيسي -->
      <div id="panel-overview" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">المقر الرئيسي</h3>
        <p style="color:var(--text-secondary);">محتوى المقر الرئيسي يظهر هنا...</p>
      </div>

      <!-- قسم مقر ابيار علي 172 -->
      <div id="panel-projects" class="panel" style="display:block;">
        
        <!-- الإحصائيات -->
        <div class="stats-grid">
          <div class="stat-card">
            <p class="title">عدد الكليات</p>
            <p class="value">3</p>
          </div>
          <div class="stat-card">
            <p class="title">عدد الأدوار</p>
            <p class="value">3</p>
          </div>
          <div class="stat-card">
            <p class="title">عدد القاعات</p>
            <p class="value">120</p>
          </div>
        </div>
        
        <!-- الصورة الرئيسية للمبنى -->
        <div class="image-container" id="main-map-container">
          <p style="font-size:15px; color:var(--text-secondary); margin:0 0 12px 0;">
            <i class="ti ti-click" style="vertical-align: middle;"></i> اضغط على الصورة أدناه لعرض مخططات الأدوار:
          </p>
          <img id="main-map-img" src="https://k.top4top.io/p_3897iqqsm1.jpg" class="building-img" alt="صورة المبنى الرئيسي">
        </div>
        
        <!-- عارض المستويات -->
        <div id="levels-viewer">
          <div class="arrows-container">
            <button id="btn-up" class="arrow-btn"><i class="ti ti-arrow-up"></i> الدور الأعلى</button>
            <button id="btn-down" class="arrow-btn"><i class="ti ti-arrow-down"></i> الدور الأسفل</button>
            <button id="btn-back" class="arrow-btn" style="color: var(--primary-color); margin-right: auto;">
              <i class="ti ti-arrow-back-up"></i> رجوع للمبنى
            </button>
          </div>
          
          <div style="text-align: center;">
            <p style="font-size:14px; color:var(--text-secondary); margin: 0 0 12px 0;">
              <i class="ti ti-zoom-in"></i> اضغط على المخطط لتكبيره
            </p>
            <img id="current-level-img" src="" alt="مخطط الدور">
            <h3 id="level-indicator" style="margin: 15px 0 0 0; color: var(--text-primary);"></h3>
          </div>
        </div>
      </div>

      <!-- قسم كلية السلام -->
      <div id="panel-tasks" class="panel" style="display:none;">
        <h3 style="margin-top:0; color:var(--text-primary);">مقر كلية السلام</h3>
        <p style="color:var(--text-secondary);">محتوى كلية السلام يظهر هنا...</p>
      </div>

    </div>
  </div>

  <script>
  // ==========================================
  // 1. نظام القائمة الجانبية (إخفاء وإظهار متجاوب)
  // ==========================================
  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggle-sidebar');

  // إخفاء القائمة في الجوال عند البداية فقط كترتيب شكلي
  if (window.innerWidth <= 768) {
      sidebar.classList.add('sidebar-hidden');
  }

  toggleSidebarBtn.addEventListener('click', function() {
    sidebar.classList.toggle('sidebar-hidden');
  });

  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      // إزالة التفعيل عن جميع الأزرار
      document.querySelectorAll('.nav-item').forEach(function(b){
        b.classList.remove('active');
      });
      // تفعيل الزر المضغوط
      btn.classList.add('active');
      
      // تبديل المحتوى
      var section = btn.getAttribute('data-section');
      document.querySelectorAll('.panel').forEach(function(p){ p.style.display = 'none'; });
      document.getElementById('panel-' + section).style.display = 'block';

      // إخفاء القائمة الجانبية بعد الاختيار (في الجوال فقط)
      if (window.innerWidth <= 768) {
         sidebar.classList.add('sidebar-hidden');
      }
    });
  });

  // ==========================================
  // 2. نظام صور الأدوار والمخططات
  // ==========================================
  const levelImages = [
    "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=100", // الدور الأرضي
    "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=100", // الدور الأول
    "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&w=1200&q=100"  // الدور الثاني
  ];
  const levelNames = ["الدور الأرضي", "الدور الأول", "الدور الثاني"];
  let currentLevel = 0; 

  const mainMapContainer = document.getElementById('main-map-container');
  const mainMapImg = document.getElementById('main-map-img');
  const levelsViewer = document.getElementById('levels-viewer');
  const currentLevelImg = document.getElementById('current-level-img');
  const levelIndicator = document.getElementById('level-indicator');
  const btnUp = document.getElementById('btn-up');
  const btnDown = document.getElementById('btn-down');
  const btnBack = document.getElementById('btn-back');

  // عند النقر على الصورة الرئيسية
  mainMapImg.addEventListener('click', function() {
    mainMapImg.classList.add('pop');
    setTimeout(function() {
      mainMapImg.classList.remove('pop');
      mainMapContainer.style.display = 'none'; 
      levelsViewer.style.display = 'flex'; 
      updateLevelView(); 
    }, 250); 
  });

  btnUp.addEventListener('click', function() {
    if (currentLevel < levelImages.length - 1) {
      currentLevel++;
      updateLevelView();
    }
  });

  btnDown.addEventListener('click', function() {
    if (currentLevel > 0) {
      currentLevel--;
      updateLevelView();
    }
  });

  btnBack.addEventListener('click', function() {
    levelsViewer.style.display = 'none';
    mainMapContainer.style.display = 'block';
    currentLevel = 0; 
  });

  function updateLevelView() {
    currentLevelImg.src = levelImages[currentLevel];
    levelIndicator.innerText = levelNames[currentLevel];
    btnDown.disabled = (currentLevel === 0);
    btnUp.disabled = (currentLevel === levelImages.length - 1);
  }

  // ==========================================
  // 3. نظام نافذة التكبير (Modal Zoom)
  // ==========================================
  const imageModal = document.getElementById('image-modal');
  const modalImg = document.getElementById('modal-img');
  const closeModalBtn = document.getElementById('close-modal');
  const zoomInBtn = document.getElementById('zoom-in');
  const zoomOutBtn = document.getElementById('zoom-out');
  
  // نحدد نسبة التكبير الابتدائية بناءً على حجم الشاشة (في الجوال 100%، في اللاب توب 80%)
  let defaultZoom = window.innerWidth <= 768 ? 100 : 80;
  let currentZoom = defaultZoom; 

  currentLevelImg.addEventListener('click', function() {
    modalImg.src = this.src;
    currentZoom = defaultZoom;
    modalImg.style.width = currentZoom + '%';
    imageModal.style.display = 'flex';
  });

  closeModalBtn.addEventListener('click', function() {
    imageModal.style.display = 'none';
  });

  zoomInBtn.addEventListener('click', function() {
    currentZoom += 25;
    modalImg.style.width = currentZoom + '%';
  });

  zoomOutBtn.addEventListener('click', function() {
    if(currentZoom > 50) {
      currentZoom -= 25;
      modalImg.style.width = currentZoom + '%';
    }
  });
  </script>

</body>
</html>
